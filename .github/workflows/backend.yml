name: Backend CI

on:
  push:
    paths:
      - 'backend/**'
  pull_request:
    paths:
      - 'backend/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
      - name: Restore
        run: dotnet restore backend/src/src.sln
      - name: Build
        run: dotnet build backend/src/src.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test backend/src/src.sln --configuration Release --no-build --no-restore
