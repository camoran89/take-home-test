version: '3.9'
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "Your_strong_Passw0rd!"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "bash -lc '/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${SA_PASSWORD}\" -Q \"SELECT 1\"' "]
      interval: 10s
      timeout: 10s
      retries: 10

  backend:
    build:
      context: ./backend/src
      dockerfile: ../backend/Dockerfile
    depends_on:
      - sqlserver
    ports:
      - "5000:80"
    environment:
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=LoanManagement;User Id=sa;Password=Your_strong_Passw0rd!;TrustServerCertificate=True;"

  frontend:
    build:
      context: ./frontend
      dockerfile: ./Dockerfile
    depends_on:
      - backend
    ports:
      - "4200:80"
